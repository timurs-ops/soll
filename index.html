<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание КИТИС</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #5a7d9a 0%, #7a9bb5 100%);
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .header h1 { color: #333; font-size: 20px; font-weight: 700; }
        .header-badges { display: flex; gap: 6px; }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .group-badge { background: #5a7d9a; color: white; }
        .teacher-badge { background: #7a9bb5; color: white; }
        .badge.inactive { background: #e0e0e0; color: #999; }
        .current-time { color: #666; font-size: 13px; }
        .stats-bar { background: white; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-around; font-size: 11px; color: #555; }
        .stat-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .stat-value { font-size: 16px; font-weight: 700; color: #5a7d9a; }
        .days-nav { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; }
        .day-btn { flex-shrink: 0; background: white; border: none; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #555; cursor: pointer; }
        .day-btn.active { background: #5a7d9a; color: white; }
        .schedule { background: white; border-radius: 16px; padding: 16px; min-height: 300px; }
        .lesson-card { border-radius: 12px; padding: 14px; margin-bottom: 12px; border-left: 4px solid #5a7d9a; background: white; }
        .lesson-card.current { border-left-color: #28a745; background: #e8f4f8; }
        .lesson-card.next { border-left-color: #ffc107; background: #fff3cd; }
        .lesson-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .lesson-number-wrap { display: flex; align-items: center; gap: 8px; }
        .lesson-number { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: white; }
        .lesson-time { color: #666; font-size: 12px; }
        .lesson-name { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .lesson-details { display: flex; gap: 12px; font-size: 11px; color: #666; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; margin-top: 8px; }
        .status-current { background: #28a745; color: white; }
        .status-next { background: #ffc107; color: #333; }
        .status-upcoming { background: #e9ecef; color: #666; }
        .no-lessons { text-align: center; padding: 40px 20px; color: #666; }
        .no-lessons .emoji { font-size: 48px; margin-bottom: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 16px; padding: 20px; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 16px; color: #333; text-align: center; font-size: 16px; }
        .list-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; max-height: 50vh; overflow-y: auto; }
        .list-item { padding: 12px; background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer; text-align: center; font-size: 14px; font-weight: 600; color: #333; }
        .list-item:hover { background: #5a7d9a; color: white; }
        .list-item.active { background: #5a7d9a; color: white; }
        .search-input { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
        .modal-close { width: 100%; padding: 10px; background: #5a7d9a; color: white; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
        .refresh-btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; margin-bottom: 10px; font-weight: 600; }
        .refresh-btn:disabled { background: #999; }
        .loading-text { text-align: center; padding: 20px; color: #5a7d9a; }
        .status-line { text-align: center; font-size: 10px; color: #888; padding: 4px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <h1>📚 КИТИС</h1>
                <div class="header-badges">
                    <span class="badge group-badge" id="groupBadge">👥 Группа</span>
                    <span class="badge teacher-badge inactive" id="teacherBadge">👨‍🏫 Преподаватель</span>
                </div>
            </div>
            <div class="current-time" id="currentTime"></div>
        </div>
        <div class="stats-bar">
            <div class="stat-item"><span>Пар сегодня</span><span class="stat-value" id="totalLessons">0</span></div>
            <div class="stat-item"><span>Начало</span><span class="stat-value" id="firstLesson">-</span></div>
            <div class="stat-item"><span>Конец</span><span class="stat-value" id="lastLesson">-</span></div>
        </div>
        <div class="days-nav" id="daysNav"></div>
        <div class="schedule" id="schedule"></div>
        <div class="status-line" id="statusLine"></div>
    </div>

    <div class="modal" id="groupModal">
        <div class="modal-content">
            <h3>Выберите группу</h3>
            <button class="refresh-btn" id="refreshGroupBtn">🔄 Загрузить с сайта КИТИС</button>
            <input type="text" class="search-input" id="groupSearch" placeholder="Поиск группы...">
            <div class="list-container" id="groupList"><div class="loading-text">Загрузка...</div></div>
            <button class="modal-close" id="closeGroupBtn">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="teacherModal">
        <div class="modal-content">
            <h3>Выберите преподавателя</h3>
            <button class="refresh-btn" id="refreshTeacherBtn">🔄 Загрузить с сайта КИТИС</button>
            <input type="text" class="search-input" id="teacherSearch" placeholder="Поиск преподавателя...">
            <div class="list-container" id="teacherList"><div class="loading-text">Загрузка...</div></div>
            <button class="modal-close" id="closeTeacherBtn">Закрыть</button>
        </div>
    </div>

    <script>
        var BASE_URL = 'http://94.72.18.202:8083';
        var PROXIES = [
            function(u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
            function(u) { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); }
        ];

        async function fetchProxy(url) {
            for (var i = 0; i < PROXIES.length; i++) {
                try {
                    var resp = await fetch(PROXIES[i](url));
                    if (!resp.ok) continue;
                    var buf = await resp.arrayBuffer();
                    var html = new TextDecoder('windows-1251').decode(buf);
                    if (html && html.length > 300) return html;
                } catch (e) {}
            }
            return null;
        }

        function text(html) {
            return String(html || '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
        }

        function parseList(html, prefix) {
            var result = [];
            var links = html.match(/<a[^>]*href=["']([^"']+)["'][^>]*>([^<]*)<\/a>/gi) || [];
            links.forEach(function(link) {
                var hrefMatch = link.match(/href=["']([^"']+)["']/i);
                var textMatch = link.match(/>([^<]*)</i);
                if (hrefMatch && textMatch) {
                    var href = hrefMatch[1];
                    var name = textMatch[1].trim();
                    var idMatch = href.match(new RegExp(prefix + '(\\d+)\\.htm', 'i'));
                    if (idMatch && name) {
                        result.push({ id: parseInt(idMatch[1]), name: name });
                    }
                }
            });
            return result;
        }

        function parseWeek(html) {
            var result = [];
            var rows = html.split(/<tr[^>]*>/i);
            var currentDate = null;
            for (var i = 1; i < rows.length; i++) {
                var row = rows[i];
                var cells = row.split(/<td[^>]*>/i);
                if (cells.length < 2) continue;
                var firstCell = text(cells[1] || '');
                if (/\d{2}\.\d{2}\.\d{4}/.test(firstCell)) {
                    currentDate = firstCell;
                }
                if (!currentDate) continue;
                for (var j = 1; j < cells.length; j++) {
                    var cell = cells[j];
                    var cellText = text(cell);
                    if (/^\d+$/.test(cellText)) {
                        var pair = parseInt(cellText);
                        var subject = '';
                        var rooms = [];
                        var teachers = [];
                        var links = cell.match(/<a[^>]*>([^<]*)<\/a>/gi) || [];
                        links.forEach(function(link) {
                            var linkText = link.match(/>([^<]*)</i)[1];
                            if (link.indexOf('ca') >= 0 || link.indexOf('z2') >= 0) {
                                rooms.push(linkText);
                            } else if (link.indexOf('cp') >= 0 || link.indexOf('z3') >= 0) {
                                teachers.push(linkText);
                            } else if (link.indexOf('j') >= 0 || link.indexOf('z1') >= 0) {
                                subject = linkText;
                            }
                        });
                        if (!subject) subject = cellText;
                        if (subject && subject !== cellText) {
                            result.push({ date: currentDate, pair: pair, subject: subject, rooms: rooms, teachers: teachers });
                        }
                    }
                }
            }
            return result;
        }

        var bells = { 1: '8:30-10:00', 2: '10:15-11:45', 3: '12:15-13:45', 4: '14:00-15:30', 5: '15:45-17:15', 6: '17:30-19:00' };
        var days = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
        var groupsData = JSON.parse(localStorage.getItem('kitis_groups') || '[]');
        var teachersData = JSON.parse(localStorage.getItem('kitis_teachers') || '[]');
        var currentGroup = localStorage.getItem('kitis_cur_group') || '';
        var currentTeacher = localStorage.getItem('kitis_cur_teacher') || null;
        var viewMode = currentTeacher ? 'teacher' : 'group';
        var currentDay = new Date().getDay();
        currentDay = currentDay === 0 ? 6 : currentDay - 1;

        function setStatus(msg) { document.getElementById('statusLine').textContent = msg || ''; }

        function updateCurrentTime() {
            var n = new Date();
            document.getElementById('currentTime').textContent = n.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + n.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function updateBadges() {
            var gb = document.getElementById('groupBadge');
            var tb = document.getElementById('teacherBadge');
            if (viewMode === 'teacher') {
                gb.classList.add('inactive');
                gb.textContent = '👥 ' + currentGroup;
                tb.classList.remove('inactive');
                tb.textContent = '👨‍🏫 ' + currentTeacher;
            } else {
                gb.classList.remove('inactive');
                gb.textContent = '👥 ' + currentGroup;
                tb.classList.add('inactive');
                tb.textContent = '👨‍🏫 Преподаватель';
            }
        }

        function renderDaysNav() {
            var nav = document.getElementById('daysNav');
            nav.innerHTML = '';
            days.forEach(function(d, i) {
                var btn = document.createElement('button');
                btn.className = 'day-btn' + (i === currentDay ? ' active' : '');
                btn.textContent = d;
                btn.onclick = function() { currentDay = i; renderDaysNav(); renderSchedule(); };
                nav.appendChild(btn);
            });
        }

        function renderSchedule() {
            var div = document.getElementById('schedule');
            var key = viewMode === 'teacher' ? 'kitis_sched_T_' + currentTeacher : 'kitis_sched_G_' + currentGroup;
            var schedule = JSON.parse(localStorage.getItem(key) || '{}');
            var dayName = days[currentDay];
            var lessons = schedule[dayName] || [];

            if (Object.keys(schedule).length === 0) {
                div.innerHTML = '<div class="no-lessons"><div class="emoji">📥</div><div>Нет данных<br><small>Нажми «👥 Группа» → «Загрузить»</small></div></div>';
                return;
            }

            if (lessons.length === 0) {
                div.innerHTML = '<div class="no-lessons"><div class="emoji">🎉</div><div>Нет пар</div></div>';
                return;
            }

            var now = new Date();
            var todayIndex = now.getDay() === 0 ? 6 : now.getDay() - 1;
            var isToday = currentDay === todayIndex;
            var html = '';

            lessons.forEach(function(lesson, index) {
                var times = lesson.time.split('-');
                var startParts = times[0].split(':').map(Number);
                var endParts = times[1].split(':').map(Number);
                var start = new Date().setHours(startParts[0], startParts[1], 0, 0);
                var end = new Date().setHours(endParts[0], endParts[1], 0, 0);
                var cardClass = '';
                var status = '<span class="status-badge status-upcoming">Предстоит</span>';

                if (isToday && now.getTime() >= start && now.getTime() <= end) {
                    cardClass = 'current';
                    status = '<span class="status-badge status-current">Сейчас</span>';
                } else if (isToday && now.getTime() < start && (index === 0 || now.getTime() > new Date().setHours(...lessons[index-1].time.split('-')[1].split(':').map(Number), 0, 0))) {
                    cardClass = 'next';
                    status = '<span class="status-badge status-next">Следующая</span>';
                }

                html += '<div class="lesson-card ' + cardClass + '">' +
                    '<div class="lesson-header"><div class="lesson-number-wrap"><div class="lesson-number" style="background:#5a7d9a">' + (index + 1) + '</div><span class="lesson-time">' + lesson.time + '</span></div></div>' +
                    '<div class="lesson-name">' + lesson.name + '</div>' +
                    '<div class="lesson-details"><span>🚪 ' + lesson.room + '</span><span>👨‍🏫 ' + lesson.teacher + '</span></div>' +
                    status + '</div>';
            });

            div.innerHTML = html;
        }

        function updateStats() {
            var key = viewMode === 'teacher' ? 'kitis_sched_T_' + currentTeacher : 'kitis_sched_G_' + currentGroup;
            var schedule = JSON.parse(localStorage.getItem(key) || '{}');
            var lessons = schedule[days[currentDay]] || [];
            document.getElementById('totalLessons').textContent = lessons.length;
            if (lessons.length > 0) {
                document.getElementById('firstLesson').textContent = lessons[0].time.split('-')[0];
                document.getElementById('lastLesson').textContent = lessons[lessons.length - 1].time.split('-')[1];
            } else {
                document.getElementById('firstLesson').textContent = '-';
                document.getElementById('lastLesson').textContent = '-';
            }
        }

        function renderList(type) {
            var data = type === 'group' ? groupsData : teachersData;
            var list = document.getElementById(type + 'List');
            var q = document.getElementById(type + 'Search').value.toLowerCase();
            var current = type === 'group' ? currentGroup : currentTeacher;

            if (data.length === 0) {
                list.innerHTML = '<div class="loading-text">Нажми «Загрузить с сайта КИТИС»</div>';
                return;
            }

            list.innerHTML = data.filter(function(item) { return item.name.toLowerCase().indexOf(q) >= 0; }).map(function(item) {
                var active = item.name === current ? ' active' : '';
                return '<div class="list-item' + active + '" data-type="' + type + '" data-name="' + item.name + '" data-id="' + item.id + '">' + item.name + '</div>';
            }).join('');

            list.querySelectorAll('.list-item').forEach(function(el) {
                el.onclick = function() {
                    var t = el.dataset.type;
                    var n = el.dataset.name;
                    var id = parseInt(el.dataset.id);
                    selectItem(t, n, id);
                };
            });
        }

        async function selectItem(type, name, id) {
            if (type === 'group') {
                currentGroup = name;
                viewMode = 'group';
                currentTeacher = null;
                localStorage.setItem('kitis_cur_group', name);
                localStorage.removeItem('kitis_cur_teacher');
            } else {
                currentTeacher = name;
                viewMode = 'teacher';
                localStorage.setItem('kitis_cur_teacher', name);
            }
            updateBadges();
            closeModal(type);
            await loadSchedule(name, id, type);
            renderSchedule();
            updateStats();
        }

        async function loadSchedule(name, id, type) {
            var prefix = type === 'group' ? 'cg' : 'cp';
            setStatus('Загрузка: ' + name + '...');
            var html = await fetchProxy(BASE_URL + '/' + prefix + id + '.htm');
            if (html) {
                var parsed = parseWeek(html);
                var result = {};
                var dayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
                parsed.forEach(function(lesson) {
                    var parts = lesson.date.split('.');
                    var d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
                    var dayName = dayNames[d.getDay()];
                    if (!result[dayName]) result[dayName] = [];
                    result[dayName].push({
                        time: bells[lesson.pair] || (lesson.pair + ' пара'),
                        name: lesson.subject,
                        room: lesson.rooms.join(', ') || '—',
                        teacher: lesson.teachers.join(', ') || '—'
                    });
                });
                var key = (type === 'group' ? 'kitis_sched_G_' : 'kitis_sched_T_') + name;
                localStorage.setItem(key, JSON.stringify(result));
                setStatus('✅ Загружено');
            } else {
                setStatus('❌ Ошибка загрузки');
            }
        }

        async function refreshData(type) {
            var btn = document.getElementById(type === 'group' ? 'refreshGroupBtn' : 'refreshTeacherBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Загрузка...';
            var page = type === 'group' ? 'cg.htm' : 'cp.htm';
            var prefix = type === 'group' ? 'cg' : 'cp';
            var html = await fetchProxy(BASE_URL + '/' + page);
            if (html) {
                var list = parseList(html, prefix);
                if (type === 'group') {
                    groupsData = list;
                    localStorage.setItem('kitis_groups', JSON.stringify(list));
                } else {
                    teachersData = list;
                    localStorage.setItem('kitis_teachers', JSON.stringify(list));
                }
                setStatus('✅ Список загружен: ' + list.length);
                btn.textContent = '✅ Обновлено!';
            } else {
                setStatus('❌ Ошибка');
                btn.textContent = '❌ Повторить';
            }
            renderList(type);
            setTimeout(function() { btn.textContent = '🔄 Загрузить с сайта КИТИС'; btn.disabled = false; }, 1500);
        }

        function openModal(type) {
            renderList(type);
            document.getElementById(type + 'Modal').classList.add('active');
        }

        function closeModal(type) {
            document.getElementById(type + 'Modal').classList.remove('active');
        }

        document.getElementById('groupBadge').onclick = function() { openModal('group'); };
        document.getElementById('teacherBadge').onclick = function() { openModal('teacher'); };
        document.getElementById('closeGroupBtn').onclick = function() { closeModal('group'); };
        document.getElementById('closeTeacherBtn').onclick = function() { closeModal('teacher'); };
        document.getElementById('refreshGroupBtn').onclick = function() { refreshData('group'); };
        document.getElementById('refreshTeacherBtn').onclick = function() { refreshData('teacher'); };
        document.getElementById('groupSearch').oninput = function() { renderList('group'); };
        document.getElementById('teacherSearch').oninput = function() { renderList('teacher'); };

        updateCurrentTime();
        updateBadges();
        renderDaysNav();
        renderSchedule();
        updateStats();
        setInterval(function() { updateCurrentTime(); renderSchedule(); }, 60000);

        if (groupsData.length === 0) {
            fetchProxy(BASE_URL + '/cg.htm').then(function(html) {
                if (html) {
                    groupsData = parseList(html, 'cg');
                    localStorage.setItem('kitis_groups', JSON.stringify(groupsData));
                    setStatus('✅ Список групп загружен');
                }
            });
        }
    </script>
</body>
</html>
