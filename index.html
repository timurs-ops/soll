<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Расписание</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 8px;
            overflow-x: hidden;
        }
        .container { max-width: 480px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .header h1 { color: #333; font-size: 16px; margin-bottom: 4px; }
        .current-time { color: #666; font-size: 11px; }
        .days-nav {
            display: flex;
            overflow-x: auto;
            gap: 6px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            scroll-behavior: smooth;
        }
        .days-nav::-webkit-scrollbar { height: 3px; }
        .days-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); border-radius: 2px; }
        .day-btn {
            flex-shrink: 0;
            background: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .day-btn.active {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }
        .schedule {
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }
        .schedule.swiping { transition: none; }
        .lesson-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .lesson-card:last-child { margin-bottom: 0; }
        .lesson-card.current {
            background: #e8f4f8;
            border-left-color: #28a745;
            animation: pulse 2s infinite;
        }
        .lesson-card.next {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }
        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .lesson-number-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lesson-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }
        .lesson-time { color: #666; font-size: 11px; font-weight: 500; }
        .lesson-name { 
            font-size: 13px; 
            font-weight: 600; 
            color: #333; 
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .lesson-details { 
            display: flex; 
            gap: 10px; 
            flex-wrap: nowrap;
            overflow: hidden;
        }
        .detail-item { 
            display: flex; 
            align-items: center; 
            gap: 3px; 
            font-size: 10px; 
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
        }
        .detail-item .icon { font-size: 12px; flex-shrink: 0; }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 6px;
        }
        .status-current { background: #28a745; color: white; }
        .status-next { background: #ffc107; color: #333; }
        .status-upcoming { background: #e9ecef; color: #666; }
        .no-lessons { text-align: center; padding: 30px 10px; color: #666; }
        .no-lessons .emoji { font-size: 36px; margin-bottom: 8px; }
        .swipe-hint {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 10px;
            margin-top: 8px;
            padding: 4px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 16px;
            max-width: 320px;
            width: 100%;
        }
        .modal-content h3 { margin-bottom: 12px; color: #333; text-align: center; font-size: 14px; }
        .color-picker {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }
        .color-option {
            width: 40px; 
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: all 0.3s;
            margin: 0 auto;
        }
        .color-option:hover { transform: scale(1.15); }
        .color-option.selected { border-color: #333; transform: scale(1.1); }
        .modal-close {
            width: 100%;
            padding: 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        @media (max-width: 480px) {
            body { padding: 6px; }
            .header h1 { font-size: 14px; }
            .current-time { font-size: 10px; }
            .day-btn { padding: 7px 10px; font-size: 10px; }
            .lesson-name { font-size: 12px; }
            .lesson-time { font-size: 10px; }
            .detail-item { font-size: 9px; }
            .color-picker { grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .color-option { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Расписание</h1>
            <div class="current-time" id="currentTime"></div>
        </div>
        <div class="days-nav" id="daysNav"></div>
        <div class="schedule" id="schedule"></div>
        <div class="swipe-hint"> Свайп для смены дня 👉</div>
    </div>
    <div class="modal" id="colorModal">
        <div class="modal-content">
            <h3>Цвет предмета</h3>
            <div class="color-picker" id="colorPicker"></div>
            <button class="modal-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>
    <script>
        const schedule = {
            'Понедельник': [
                { time: '8:30-10:00', name: 'Математика', room: '120', teacher: 'Иванов' },
                { time: '10:15-11:45', name: 'Физика', room: '205', teacher: 'Петров' },
                { time: '12:00-13:30', name: 'Информатика', room: '310', teacher: 'Сидоров' },
                { time: '13:45-15:15', name: 'Английский', room: '115', teacher: 'Смирнова' }
            ],
            'Вторник': [
                { time: '8:30-10:00', name: 'История', room: '220', teacher: 'Козлов' },
                { time: '10:15-11:45', name: 'Литература', room: '118', teacher: 'Новикова' },
                { time: '12:00-13:30', name: 'Биология', room: '305', teacher: 'Морозов' }
            ],
            'Среда': [
                { time: '8:30-10:00', name: 'Химия', room: '215', teacher: 'Волков' },
                { time: '10:15-11:45', name: 'География', room: '208', teacher: 'Соколов' },
                { time: '12:00-13:30', name: 'Физкультура', room: 'Спортзал', teacher: 'Лебедев' },
                { time: '13:45-15:15', name: 'ОБЖ', room: '112', teacher: 'Попов' }
            ],
            'Четверг': [
                { time: '8:30-10:00', name: 'Обществознание', room: '225', teacher: 'Васильев' },
                { time: '10:15-11:45', name: 'Математика', room: '120', teacher: 'Иванов' },
                { time: '12:00-13:30', name: 'Информатика', room: '310', teacher: 'Сидоров' }
            ],
            'Пятница': [
                { time: '8:30-10:00', name: 'Физика', room: '205', teacher: 'Петров' },
                { time: '10:15-11:45', name: 'Английский', room: '115', teacher: 'Смирнова' },
                { time: '12:00-13:30', name: 'Литература', room: '118', teacher: 'Новикова' },
                { time: '13:45-15:15', name: 'История', room: '220', teacher: 'Козлов' }
            ],
            'Суббота': [
                { time: '8:30-10:00', name: 'Биология', room: '305', teacher: 'Морозов' },
                { time: '10:15-11:45', name: 'Химия', room: '215', teacher: 'Волков' }
            ],
            'Воскресенье': []
        };
        const colors = ['#A8D8EA','#AA96DA','#FCBAD3','#FFFFD2','#A8E6CF','#FFD3B6','#D4A5A5','#B5EAD7','#C7CEEA','#F8B195','#E2F0CB','#FFDAC1'];
        const days = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
        let currentDay = new Date().getDay();
        currentDay = currentDay === 0 ? 6 : currentDay - 1;
        let selectedLesson = null;

        function loadColors() { const s = localStorage.getItem('lessonColors'); return s ? JSON.parse(s) : {}; }
        function saveColors(c) { localStorage.setItem('lessonColors', JSON.stringify(c)); }
        function parseTime(t) {
            const [s,e] = t.split('-');
            const [sh,sm] = s.split(':').map(Number);
            const [eh,em] = e.split(':').map(Number);
            return { start: new Date().setHours(sh,sm,0,0), end: new Date().setHours(eh,em,0,0) };
        }
        function updateCurrentTime() {
            const n = new Date();
            document.getElementById('currentTime').textContent =
                n.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}) + ', ' +
                n.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
        }
        function renderDaysNav() {
            const nav = document.getElementById('daysNav');
            nav.innerHTML = '';
            days.forEach((d,i) => {
                const b = document.createElement('button');
                b.className = 'day-btn ' + (i === currentDay ? 'active' : '');
                b.textContent = d.substring(0, 3);
                b.onclick = () => { currentDay = i; renderDaysNav(); renderSchedule(); };
                nav.appendChild(b);
            });
            setTimeout(() => {
                const activeBtn = nav.querySelector('.day-btn.active');
                if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 50);
        }
        function renderSchedule() {
            const div = document.getElementById('schedule');
            const dayName = days[currentDay];
            const lessons = schedule[dayName];
            const lc = loadColors();
            if (lessons.length === 0) {
                div.innerHTML = '<div class="no-lessons"><div class="emoji">🎉</div><div>Выходной</div></div>';
                return;
            }
            const now = new Date();
            const todayIndex = now.getDay() === 0 ? 6 : now.getDay() - 1;
            const isToday = currentDay === todayIndex;
            let html = '';
            lessons.forEach((lesson, index) => {
                const times = parseTime(lesson.time);
                let status = '', cardClass = '';
                const colorKey = dayName + '-' + lesson.name;
                const lessonColor = lc[colorKey] || '#667eea';
                if (isToday && now.getTime() >= times.start && now.getTime() <= times.end) {
                    status = '<span class="status-badge status-current">Сейчас</span>';
                    cardClass = 'current';
                } else if (isToday && now.getTime() < times.start &&
                           (index === 0 || now.getTime() > parseTime(lessons[index-1].time).end)) {
                    status = '<span class="status-badge status-next">Следующая</span>';
                    cardClass = 'next';
                } else {
                    status = '<span class="status-badge status-upcoming">Предстоит</span>';
                }
                html += '<div class="lesson-card ' + cardClass + '" style="border-left-color:' + lessonColor + '" onclick="openColorModal(\'' + colorKey + '\',\'' + lessonColor + '\')">' +
                    '<div class="lesson-header">' +
                        '<div class="lesson-number-wrap">' +
                            '<div class="lesson-number" style="background:' + lessonColor + '">' + (index+1) + '</div>' +
                            '<span class="lesson-time">' + lesson.time + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="lesson-name">' + lesson.name + '</div>' +
                    '<div class="lesson-details">' +
                        '<div class="detail-item"><span class="icon">🚪</span><span>Каб. ' + lesson.room + '</span></div>' +
                        '<div class="detail-item"><span class="icon">👨‍🏫</span><span>' + lesson.teacher + '</span></div>' +
                    '</div>' + status + '</div>';
            });
            div.innerHTML = html;
        }
        function openColorModal(key, color) {
            selectedLesson = key;
            const picker = document.getElementById('colorPicker');
            picker.innerHTML = '';
            colors.forEach(c => {
                const o = document.createElement('div');
                o.className = 'color-option' + (c === color ? ' selected' : '');
                o.style.background = c;
                o.onclick = () => selectColor(c);
                picker.appendChild(o);
            });
            document.getElementById('colorModal').classList.add('active');
        }
        function selectColor(color) {
            const lc = loadColors();
            lc[selectedLesson] = color;
            saveColors(lc);
            closeModal();
            renderSchedule();
        }
        function closeModal() {
            document.getElementById('colorModal').classList.remove('active');
            selectedLesson = null;
        }

        let touchStartX = 0;
        let touchEndX = 0;
        const scheduleEl = document.getElementById('schedule');

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            const threshold = 50;
            if (Math.abs(diff) < threshold) return;
            if (diff > 0 && currentDay < days.length - 1) {
                currentDay++;
            } else if (diff < 0 && currentDay > 0) {
                currentDay--;
            } else {
                return;
            }
            scheduleEl.classList.add('swiping');
            scheduleEl.style.transform = diff > 0 ? 'translateX(-15px)' : 'translateX(15px)';
            setTimeout(() => {
                scheduleEl.style.transform = 'translateX(0)';
                scheduleEl.classList.remove('swiping');
            }, 50);
            renderDaysNav();
            renderSchedule();
        }

        scheduleEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        scheduleEl.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });
        let mouseDown = false;
        scheduleEl.addEventListener('mousedown', e => { mouseDown = true; touchStartX = e.screenX; });
        scheduleEl.addEventListener('mouseup', e => { if (!mouseDown) return; mouseDown = false; touchEndX = e.screenX; handleSwipe(); });
        scheduleEl.addEventListener('mouseleave', () => { mouseDown = false; });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' && currentDay < days.length - 1) { currentDay++; renderDaysNav(); renderSchedule(); }
            else if (e.key === 'ArrowLeft' && currentDay > 0) { currentDay--; renderDaysNav(); renderSchedule(); }
        });

        updateCurrentTime();
        renderDaysNav();
        renderSchedule();
        setInterval(() => { updateCurrentTime(); renderSchedule(); }, 60000);
        document.getElementById('colorModal').addEventListener('click', e => { if (e.target.id === 'colorModal') closeModal(); });
    </script>
</body>
</html>
